<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">AI IT Support Assistant</title><desc id="d">A structured troubleshooting conversation proceeds from symptom to evidence, action and verification.</desc><rect width="900" height="520" fill="#101511"/><g stroke="#273229" opacity=".65"><path d="M0 52h900M0 104h900M0 156h900M0 208h900M0 260h900M0 312h900M0 364h900M0 416h900M0 468h900"/><path d="M90 0v520M180 0v520M270 0v520M360 0v520M450 0v520M540 0v520M630 0v520M720 0v520M810 0v520"/></g><g font-family="IBM Plex Mono,monospace"><text x="42" y="48" fill="#c9ae78" font-size="12" letter-spacing="2">AI IT SUPPORT / STAGE 01</text><text x="42" y="76" fill="#68736a" font-size="9">STATIC KNOWLEDGE SYSTEM · STRUCTURED TROUBLESHOOTING</text></g><g fill="none" stroke="#647166" stroke-width="2"><path d="M172 266h76M390 266h76M608 266h76"/></g><g fill="#9cad91"><path d="m247 261 10 5-10 5zM465 261l10 5-10 5zM683 261l10 5-10 5z"/></g><g font-family="Inter,sans-serif"><g transform="translate(42 192)"><rect width="130" height="148" rx="3" fill="#182019" stroke="#536056"/><text x="18" y="28" fill="#c9ae78" font-size="9" font-family="IBM Plex Mono,monospace">01 / SYMPTOM</text><text x="18" y="60" fill="#eeeae0" font-size="15" font-weight="700">User report</text><text x="18" y="87" fill="#8d998f" font-size="10">Wi-Fi connected</text><text x="18" y="104" fill="#8d998f" font-size="10">Sites not opening</text><circle cx="22" cy="127" r="5" fill="#c9ae78"/><text x="34" y="131" fill="#c7cfc8" font-size="9">ISSUE CAPTURED</text></g><g transform="translate(260 192)"><rect width="130" height="148" rx="3" fill="#182019" stroke="#536056"/><text x="18" y="28" fill="#c9ae78" font-size="9" font-family="IBM Plex Mono,monospace">02 / EVIDENCE</text><text x="18" y="60" fill="#eeeae0" font-size="15" font-weight="700">Inspect</text><text x="18" y="87" fill="#8d998f" font-size="10">ipconfig /all</text><text x="18" y="104" fill="#8d998f" font-size="
name: PDF workspace checks
on:
  push:
    branches: [main, feat/pdf-page-workspace, feat/pdf-workspace-ux-v2]
    paths: ['pdf-*.js', 'pdf-tools.css', 'resume-builder.html', 'vendor/pdf-tools/**', 'tests/**', 'package*.json', '.github/workflows/pdf-workspace.yml']
  pull_request:
    paths: ['pdf-*.js', 'pdf-tools.css', 'resume-builder.html', 'vendor/pdf-tools/**', 'tests/**', 'package*.json', '.github/workflows/pdf-workspace.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:ui
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 > /tmp/pdf-server.log 2>&1 &
      - run: node tests/pdf-workspace.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-workspace-test-results
          path: test-results/
          retention-days: 14
